name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # nightly: integration suite against real Postgres (ADR-0005)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Lint OpenAPI contracts
        run: npx --yes @redocly/cli@1.34.5 lint services/*/openapi.yaml
      - run: npm run test:coverage
      - run: npm run build

  python-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [llm-gateway, parsing-svc]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check src tests ../../packages/py-platform/src
      - run: uv run ruff format --check src tests ../../packages/py-platform/src
      - run: uv run mypy src tests
      # Real embedded Postgres (pgserver) with the service's migrations and RLS enforced; the
      # parsing-svc suite also runs ParseResumeWorkflow on Temporal's time-skipping test server.
      - name: pytest
        run: uv run pytest --cov="$(echo '${{ matrix.service }}' | tr - _)" --cov-fail-under=85

  migrations-real-postgres:
    if: github.event_name == 'schedule' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: atlas_owner
          POSTGRES_PASSWORD: atlas_owner_dev
          POSTGRES_DB: atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atlas_owner -d atlas" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm run build
      - name: Apply migrations twice (second run must be a no-op)
        env:
          ATLAS_DATABASE_OWNER_URL: postgres://atlas_owner:atlas_owner_dev@localhost:5432/atlas
        run: npm run migrate && npm run migrate
