# LiveKit SFU (config: infra/livekit/livekit.yaml, mounted from a ConfigMap built from it).
apiVersion: apps/v1
kind: Deployment
metadata: { name: livekit, namespace: atlas-interview, labels: { app.kubernetes.io/name: livekit } }
spec:
  replicas: {{ .Values.livekit.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: livekit } }
  template:
    metadata: { labels: { app.kubernetes.io/name: livekit } }
    spec:
      automountServiceAccountToken: false
      hostNetwork: true # media ports (UDP 7882) must be reachable from candidates
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: livekit
          image: '{{ .Values.livekit.image }}'
          args: ['--config', '/etc/livekit/livekit.yaml']
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          env:
            - name: LIVEKIT_KEYS
              valueFrom: { secretKeyRef: { name: '{{ .Values.secrets.livekit }}', key: keys } }
            - name: LIVEKIT_REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: '{{ .Values.secrets.redis }}', key: password } }
          ports:
            - { name: http, containerPort: 7880 }
            - { name: rtc-tcp, containerPort: 7881 }
            - { name: rtc-udp, containerPort: 7882, protocol: UDP }
          volumeMounts: [{ name: config, mountPath: /etc/livekit, readOnly: true }]
          resources: { requests: { cpu: '2', memory: 2Gi }, limits: { memory: 4Gi } }
      volumes: [{ name: config, configMap: { name: livekit-config } }]
