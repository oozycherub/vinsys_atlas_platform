[project]
name = "atlas-llm-gateway"
version = "0.1.0"
description = "Atlas llm-gateway (brick 5): model routing, redaction, budgets, prompt registry, embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.1.0",
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pyjwt[crypto]==2.15.1",
    "jsonschema==4.26.0",
    "presidio-analyzer==2.2.364",
    "spacy==3.8.16",
    "redis==8.1.0",
    "aiokafka==0.14.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "en-core-web-sm",
    "atlas-platform[pii]",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pgserver==0.1.4",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-jsonschema==4.26.0.20261006",
    "types-pyyaml==6.0.12.20260906",
    "pytest-cov==7.0.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[tool.uv]
# The spaCy pipeline Presidio uses for named-entity recognition (small model in dev/test;
# production sets ATLAS_LLM_SPACY_MODEL to en_core_web_lg).
[tool.uv.sources]
atlas-platform = { path = "../../packages/py-platform", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["S101", "E501"]  # asserts are fine; line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "spacy.*", "aiokafka.*", "pgserver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
