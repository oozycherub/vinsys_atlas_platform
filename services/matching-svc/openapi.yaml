openapi: 3.1.0
info:
  title: Atlas matching-svc
  version: 1.0.0
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  description: >
    Job requisitions and hybrid candidate ↔ requisition scoring (docs/prompts/07-matching-svc.md).
    Score = M · (w_sem·SEM + w_cov·COV + w_exp·EXP + w_lex·LEX) exactly as PRD §2.1(b), with the
    tenant's weights recorded as weights_version. Retrieval is HNSW ANN (parsing-svc) unioned with
    BM25, then re-ranked. Candidates and employees never see scores. All errors are RFC 9457
    problem documents. Custom methods follow AIP-136 (`/{id}:verb`).
servers:
  - url: http://matching-svc:8087
security:
  - bearer: []

paths:
  /v1/job-requisitions:
    post:
      operationId: createRequisition
      summary: 'Create a requisition (Idempotency-Key). Roles: tenant_admin, recruiter, hiring_manager; staff and services pass tenant_id.'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequisition' }
      responses:
        '201': { $ref: '#/components/responses/RequisitionWithETag' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listRequisitions
      summary: Requisitions, newest first (cursor pagination).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: status, in: query, schema: { type: string, enum: [open, on_hold, closed] } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of requisitions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Requisition' } }
                  next_cursor: { type: [string, 'null'] }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/job-requisitions/{requisitionId}:
    parameters:
      - $ref: '#/components/parameters/RequisitionId'
      - $ref: '#/components/parameters/TenantId'
    get:
      operationId: getRequisition
      summary: A requisition with its calibration state.
      responses:
        '200': { $ref: '#/components/responses/RequisitionWithETag' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: patchRequisition
      summary: 'Edit fields (If-Match). Changing what it asks for marks the calibration stale.'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchRequisition' }
      responses:
        '200': { $ref: '#/components/responses/RequisitionWithETag' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }

  /v1/job-requisitions/{requisitionId}:calibrate:
    post:
      operationId: calibrateRequisition
      summary: 'Snapshot requirements (linked job profile, or `skills`), related-skill weights ρ ≤ 0.8 and the requisition embedding; then rank all candidates (rediscovery). Emits matching.requisition.calibrated.v1.'
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                skills:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    required: [skill_id, weight, target]
                    properties:
                      skill_id: { type: string, format: uuid }
                      weight: { type: number, exclusiveMinimum: 0, maximum: 1 }
                      target: { type: number, minimum: 0, maximum: 5 }
                      must_have: { type: boolean, default: false }
      responses:
        '200':
          description: The calibrated requisition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requisition' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: NO_REQUIREMENTS, JOB_PROFILE_NOT_FOUND or REQUISITION_CLOSED.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/job-requisitions/{requisitionId}:match:
    post:
      operationId: matchRequisition
      summary: 'Ranked candidates with score, band, components and explanation. Cached 10 min per (requisition, calibration, weights_version).'
      parameters:
        - $ref: '#/components/parameters/RequisitionId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant_id: { type: string, format: uuid, description: Platform principals only. }
                limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    min_score: { type: number, minimum: 0, maximum: 1 }
                    bands:
                      type: array
                      items: { type: string, enum: [strong, good, partial, weak] }
                    exclude_candidate_ids:
                      type: array
                      maxItems: 1000
                      items: { type: string, format: uuid }
      responses:
        '200':
          description: Ranked candidates.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    requisition_id,
                    weights_version,
                    calibration_version,
                    computed_at,
                    cached,
                    total,
                    results,
                  ]
                properties:
                  requisition_id: { type: string, format: uuid }
                  weights_version: { type: string }
                  calibration_version: { type: integer }
                  computed_at: { type: string, format: date-time }
                  cached: { type: boolean }
                  total: { type: integer }
                  results: { type: array, items: { $ref: '#/components/schemas/ScoredCandidate' } }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: REQUISITION_NOT_CALIBRATED, REQUISITION_CLOSED or INVALID_WEIGHTS.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/candidates/{candidateId}/matches:
    get:
      operationId: getCandidateMatches
      summary: A candidate's stored scores against open requisitions, best first.
      parameters:
        - { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/TenantId'
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          description: The candidate's matches.
          content:
            application/json:
              schema:
                type: object
                required: [candidate_id, items]
                properties:
                  candidate_id: { type: string, format: uuid }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        requisition_id: { type: string, format: uuid }
                        title: { type: string }
                        status: { type: string }
                        score: { type: number }
                        band: { type: string }
                        components: { $ref: '#/components/schemas/Components' }
                        explanation: { $ref: '#/components/schemas/Explanation' }
                        weights_version: { type: string }
                        computed_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Problem' }

  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe.
      security: []
      responses: { '200': { description: Alive. } }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (database reachable).
      security: []
      responses:
        '200': { description: Ready. }
        '503': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    TenantId:
      name: tenant_id
      in: query
      required: false
      description: Platform principals only; tenant users act on their own tenant.
      schema: { type: string, format: uuid }
    RequisitionId:
      { name: requisitionId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{8,128}$' }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: RFC 9457 problem document.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RequisitionWithETag:
      description: The requisition.
      headers:
        ETag: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Requisition' }

  schemas:
    CreateRequisition:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        tenant_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        openings: { type: integer, minimum: 1, maximum: 1000, default: 1 }
        location: { type: [string, 'null'], maxLength: 200 }
        hiring_manager_id: { type: [string, 'null'], format: uuid }
        job_profile_id: { type: [string, 'null'], format: uuid }
        min_experience_years: { type: [number, 'null'], minimum: 0, maximum: 60 }
        keywords: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }

    PatchRequisition:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        openings: { type: integer, minimum: 1, maximum: 1000 }
        location: { type: [string, 'null'], maxLength: 200 }
        hiring_manager_id: { type: [string, 'null'], format: uuid }
        job_profile_id: { type: [string, 'null'], format: uuid }
        min_experience_years: { type: [number, 'null'], minimum: 0, maximum: 60 }
        keywords: { type: array, maxItems: 50, items: { type: string, maxLength: 60 } }
        status: { type: string, enum: [open, on_hold, closed] }

    Requisition:
      type: object
      properties:
        requisition_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        openings: { type: integer }
        location: { type: [string, 'null'] }
        hiring_manager_id: { type: [string, 'null'], format: uuid }
        job_profile_id: { type: [string, 'null'], format: uuid }
        min_experience_years: { type: [number, 'null'] }
        keywords: { type: array, items: { type: string } }
        status: { type: string, enum: [open, on_hold, closed] }
        calibration:
          type: object
          properties:
            status: { type: string, enum: [uncalibrated, calibrated, stale] }
            version: { type: integer }
            calibrated_at: { type: [string, 'null'], format: date-time }
            source: { type: [string, 'null'], enum: [job_profile, manual, null] }
            job_profile_version: { type: [integer, 'null'] }
            embedding_model: { type: [string, 'null'] }
            skills:
              type: array
              items:
                type: object
                properties:
                  skill_id: { type: string, format: uuid }
                  name: { type: [string, 'null'] }
                  weight: { type: number }
                  target: { type: number }
                  must_have: { type: boolean }
                  related:
                    {
                      type: integer,
                      description: Number of related skills that can give partial credit.,
                    }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Components:
      type: object
      description: Each component in [0, 1]; gate is the must-have multiplier (1, 0.5, 0.25, …).
      properties:
        sem: { type: number }
        sem_cosine: { type: number }
        cov: { type: number }
        exp: { type: number }
        lex: { type: number }
        gate: { type: number }

    SkillLine:
      type: object
      properties:
        skill_id: { type: string, format: uuid }
        required: { type: number }
        candidate: { type: [number, 'null'] }
        must_have: { type: boolean }
        via:
          type: object
          description: The related skill that supplied partial credit.
          properties:
            skill_id: { type: string, format: uuid }
            rho: { type: number, maximum: 0.8 }

    Explanation:
      type: object
      properties:
        matched: { type: array, items: { $ref: '#/components/schemas/SkillLine' } }
        partial: { type: array, items: { $ref: '#/components/schemas/SkillLine' } }
        gaps: { type: array, items: { $ref: '#/components/schemas/SkillLine' } }
        must_have_failed: { type: array, items: { type: string, format: uuid } }
        evidence:
          type: array
          description: Redacted résumé snippets supporting matched skills.
          items:
            type: object
            properties:
              skill_id: { type: string, format: uuid }
              snippet: { type: string }
        closest_chunks:
          type: array
          items: { type: string }

    ScoredCandidate:
      type: object
      properties:
        candidate_id: { type: string, format: uuid }
        score: { type: number, minimum: 0, maximum: 1 }
        band: { type: string, enum: [strong, good, partial, weak] }
        components: { $ref: '#/components/schemas/Components' }
        explanation: { $ref: '#/components/schemas/Explanation' }

    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          examples:
            [
              REQUISITION_NOT_FOUND,
              REQUISITION_NOT_CALIBRATED,
              REQUISITION_CLOSED,
              NO_REQUIREMENTS,
              INVALID_WEIGHTS,
              DEPENDENCY_UNAVAILABLE,
            ]
        request_id: { type: string }
        errors: { type: array, items: { type: object } }
