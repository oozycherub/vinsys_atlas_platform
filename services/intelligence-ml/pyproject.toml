[project]
name = "atlas-intelligence-ml"
version = "0.1.0"
description = "Atlas intelligence-ml (brick 12): CP-SAT fulfilment plans and the attrition pipeline (LightGBM, SHAP, Dagster)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-platform",
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "ortools==9.15.6755",
    "dagster==1.13.29",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
]

[project.optional-dependencies]
# Feature serving through Feast (feature_repo/); the pipeline computes the same features in SQL.
feast = ["feast==0.67.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "pgserver==0.1.4",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pandas-stubs==2.3.3.260113",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelligence_ml"]

[tool.uv.sources]
atlas-platform = { path = "../../packages/py-platform", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["S101", "E501", "N803", "N806"]  # asserts; line length is the formatter's job; X/y names

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:eval"

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "ortools.*", "sklearn.*", "pgserver.*", "dagster.*", "feast.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["eval"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
