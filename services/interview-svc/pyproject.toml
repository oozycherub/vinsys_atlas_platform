[project]
name = "atlas-interview-svc"
version = "0.1.0"
description = "Atlas interview-svc (brick 11): AI voice/text interviews (LangGraph orchestrator, agent workers, separated scoring)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-platform",
    "langgraph==1.2.20",
    "rapidfuzz==3.14.6",
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "aiokafka==0.14.0",
    "httpx==0.28.1",
    "websockets==17.4",
    "numpy==2.4.6",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# The agent worker image: LiveKit, Silero VAD, faster-whisper and S3 for recordings.
voice = [
    "livekit==1.0.12",
    "silero-vad==6.0.0",
    "faster-whisper==1.2.0",
    "boto3==1.43.124",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "pgserver==0.1.4",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "httpx-ws==0.9.0",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interview_svc"]

[tool.uv.sources]
atlas-platform = { path = "../../packages/py-platform", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:eval"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*", "pgserver.*", "boto3.*", "livekit.*", "faster_whisper.*", "silero_vad.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["eval"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
