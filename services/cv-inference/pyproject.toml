[project]
name = "atlas-cv-inference"
version = "0.1.0"
description = "Atlas cv-inference (brick 10): proctoring frame and audio analysis (quality gate, faces, identity, head pose, objects, speakers) on Triton"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-platform",
    "numpy==2.4.6",
    "opencv-python-headless==5.0.0.93",
    "tritonclient[grpc]==2.74.0",
    "aiokafka==0.14.0",
    "boto3==1.43.124",
    "httpx==0.28.1",
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "av==19.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "boto3-stubs[s3]==1.43.124",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_inference"]

[tool.uv.sources]
atlas-platform = { path = "../../packages/py-platform", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "N806"]
"src/cv_inference/domain/**" = ["N806"]  # matrix names (R, K) follow the maths

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:eval"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "tritonclient.*", "aiokafka.*", "av", "av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
