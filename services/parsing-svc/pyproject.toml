[project]
name = "atlas-parsing-svc"
version = "0.1.0"
description = "Atlas parsing-svc (brick 6): résumé security gate, extraction, redaction, LLM extraction, verification, normalisation, embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atlas-platform[pii]",
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "temporalio==1.35.0",
    "pymupdf==2.1",
    "pikepdf==10.17.0",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "rapidfuzz==3.14.6",
    "boto3==1.43.124",
    "httpx==0.28.1",
    "aiokafka==0.14.0",
    "pyyaml==6.0.3",
    "en-core-web-sm",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "pgserver==0.1.4",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "boto3-stubs[s3]==1.43.124",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsing_svc"]

[tool.uv.sources]
atlas-platform = { path = "../../packages/py-platform", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = ["S101", "E501"]  # asserts are fine; line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S608"]
# Column lists and table names interpolated into SQL are module constants; values are always bound.
"src/parsing_svc/infrastructure/repositories.py" = ["S608"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer.*", "spacy.*", "aiokafka.*", "pgserver.*", "fitz.*", "pymupdf.*", "pdfplumber.*", "docx.*", "paddleocr.*", "pikepdf.*"]
ignore_missing_imports = true

# PyMuPDF ships partial annotations (untyped Document); treat it as untyped.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PyMuPDF's SWIG bindings on Python 3.12
    "ignore:builtin type [Ss]wig:DeprecationWarning",
]
